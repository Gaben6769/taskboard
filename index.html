<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дошка завдань | TaskBoard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img src="images/logo.png" alt="Логотип TaskBoard" width="36" height="36">
      <span>TaskBoard</span>
    </a>
    <nav class="nav" aria-label="Основна навігація">
      <a href="index.html" aria-current="page">Головна</a>
      <a href="about.html">Про автора</a>
    </nav>
  </header>
  <main class="container">
    <section class="intro">
      <h1>Дошка завдань</h1>
      <p>Записуй справи, визначай пріоритети й відмічай виконане.</p>
    </section>
    <section class="card" aria-labelledby="new-task">
      <h2 id="new-task">Нова задача</h2>
      <form id="task-form" class="task-form">
        <div class="form-row">
          <label class="field grow">
            <span>Назва</span>
            <input id="title" name="title" type="text" required maxlength="80" placeholder="Наприклад, підготувати звіт">
          </label>
          <label class="field">
            <span>Пріоритет</span>
            <select id="priority" name="priority">
              <option value="low">Низький</option>
              <option value="medium" selected>Середній</option>
              <option value="high">Високий</option>
            </select>
          </label>
          <label class="field">
            <span>Термін</span>
            <input id="deadline" name="deadline" type="date">
          </label>
        </div>
        <label class="field">
          <span>Опис</span>
          <textarea id="description" name="description" rows="3" placeholder="Деталі задачі (необов’язково)"></textarea>
        </label>
        <button class="btn" type="submit">Додати задачу</button>
        <p id="form-message" class="form-message" role="alert"></p>
      </form>
    </section>
  </main>
  <footer class="site-footer">
    <p>TaskBoard · Денис Яремчук · КН-3/1</p>
  </footer>
</body>
</html>
